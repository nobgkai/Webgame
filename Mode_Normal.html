<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medium Mode | Panda's Chinese Quest</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800;900&family=Mali:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              purpleBg: "#9871FA",
              purpleDark: "#7A4FE2",
              bossHp: "#8A32D2",
              playerHp: "#F33B6D",
              mintDeep: "#53D797",
              skyLight: "#90E2FF",
              yellowBar: "#F3CE38",
              ink: "#3A3355",
            },
            fontFamily: {
              display: ["Fredoka", "Mali", "sans-serif"],
              thai: ["Mali", "sans-serif"],
              hanzi: ["'Noto Sans SC'", "sans-serif"],
            },
            boxShadow: {
              card: "0 8px 20px rgba(0,0,0,0.12)",
              btn: "0 4px 0 rgba(0,0,0,0.15)",
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Mali", sans-serif;
        background-color: #9871fa;
        color: #3a3355;
        transition:
          background-color 0.5s ease,
          background-image 0.5s ease;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
      .font-display {
        font-family: "Fredoka", "Mali", sans-serif;
      }
      .font-hanzi {
        font-family: "'Noto Sans SC'", sans-serif;
      }

      /* Background Circles Pattern & Moving Animation */
      .bg-pattern {
        animation: moveBg 12s ease-in-out infinite alternate;
      }

      @keyframes moveBg {
        0% {
          background-position:
            0px 0px,
            0px 0px,
            0px 0px,
            0px 0px,
            center;
        }
        50% {
          background-position:
            30px -20px,
            -20px 30px,
            25px 25px,
            -30px -15px,
            center;
        }
        100% {
          background-position:
            -20px 25px,
            25px -20px,
            -15px -30px,
            20px 20px,
            center;
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-12px) rotate(-1deg);
        }
        40% {
          transform: translateX(10px) rotate(1deg);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }
      .shake {
        animation: shake 0.4s ease;
      }

      @keyframes hit {
        0% {
          transform: scale(1);
          filter: brightness(1);
        }
        30% {
          transform: scale(0.92);
          filter: brightness(1.6) saturate(2);
        }
        100% {
          transform: scale(1);
          filter: brightness(1);
        }
      }
      .hit {
        animation: hit 0.35s ease;
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .float-slow {
        animation: floaty 3.5s ease-in-out infinite;
      }

      .icon-btn {
        transition: transform 0.12s ease;
      }
      .icon-btn:hover:not(:disabled) {
        transform: scale(1.08);
      }
      .icon-btn:active:not(:disabled) {
        transform: scale(0.95);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none !important;
      }

      #timer-bar {
        transition: width 0.1s linear;
      }
      #boss-hp-bar,
      #player-hp-bar {
        transition: width 0.35s ease;
      }

      #answer-input {
        transition:
          box-shadow 0.15s ease,
          border-color 0.15s ease;
      }
      #answer-input.ring-correct {
        border-color: #53d797 !important;
        box-shadow: 0 0 0 4px rgba(83, 215, 151, 0.35);
      }
      #answer-input.ring-wrong {
        border-color: #f33b6d !important;
        box-shadow: 0 0 0 4px rgba(243, 59, 109, 0.35);
      }

      /* Speech bubble pointer facing UP towards boss */
      .speech-bubble {
        position: relative;
      }
      .speech-bubble::before {
        content: "";
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-bottom: 15px solid white;
      }

      /* EFFECT: DAMAGE BLUR */
      #damage-overlay {
        position: fixed;
        inset: 0;
        box-shadow: inset 0 0 100px 40px rgba(220, 38, 38, 0.7);
        opacity: 0;
        pointer-events: none;
        z-index: 100;
        transition: opacity 0.3s ease-in-out;
      }
      #damage-overlay.active {
        opacity: 1;
      }

      /* EFFECT: COMBO POPUP */
      @keyframes comboPop {
        0% {
          opacity: 0;
          transform: scale(0.5) rotate(-10deg);
        }
        20% {
          opacity: 1;
          transform: scale(1.2) rotate(5deg);
        }
        40% {
          transform: scale(1) rotate(0deg);
        }
        80% {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
        100% {
          opacity: 0;
          transform: scale(0.8) translateY(-40px);
        }
      }
      .combo-animate {
        animation: comboPop 1.2s ease-out forwards;
      }

      /* Keep the complete game board visible at every viewport size. */
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden !important;
      }
      body {
        min-height: 100dvh;
        padding: clamp(8px, 1.5vh, 24px);
        align-items: center !important;
      }
      #game-container {
        --board-zoom: clamp(0.72, calc(100dvh / 800px), 0.98);
        zoom: var(--board-zoom);
        width: min(100%, 32rem);
        max-height: calc(100dvh / var(--board-zoom));
      }
      @media (max-width: 420px) {
        #game-container {
          width: min(100%, 30rem);
        }
        #boss-name {
          max-width: 38%;
          font-size: 0.95rem;
        }
      }
      @media (max-height: 540px) {
        #game-container {
          --board-zoom: clamp(0.52, calc(100dvh / 760px), 0.75);
        }
      }
      #game-modal {
        overflow-y: auto;
        padding: clamp(16px, 3vh, 24px);
      }
      #modal-card {
        max-height: calc(100dvh - 32px);
        overflow: visible;
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-pattern flex items-center justify-center p-3 md:p-6 overflow-hidden"
  >
    <div
      id="game-container"
      class="w-full max-w-lg mx-auto relative select-none pt-2"
    >
      <!-- ZONE: BOSS HEADER & IMAGE -->
      <div
        class="relative w-full flex flex-col items-center mb-2 min-h-[260px]"
      >
        <!-- LAYER 1: รูปบอส -->
        <div
          class="absolute inset-0 flex justify-center items-center z-10 pointer-events-none -top-4"
        >
          <img
            id="boss-image"
            src="public/1.png?v=1"
            alt="boss"
            class="w-72 h-72 md:w-80 md:h-80 object-contain drop-shadow-2xl float-slow"
          />
        </div>

        <!-- LAYER 2: TOP BAR -->
        <div
          class="w-full flex items-center justify-between gap-2 mb-2 z-20 relative px-1"
        >
          <!-- Boss Badge -->
          <div
            class="bg-white/90 rounded-full px-3 py-1 shadow-md flex items-center gap-1.5 text-xs md:text-sm font-display text-pink-500 font-bold"
          >
            <i class="fa-solid fa-dragon text-pink-400"></i>
            <span>Boss<span id="boss-progress">1</span>/5</span>
          </div>

          <!-- Boss Title -->
          <h2
            id="boss-name"
            class="font-display font-bold text-lg md:text-xl text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)] text-center truncate"
          >
            จอมเวลา ปีศาจนาฬิกา
          </h2>

          <!-- Right Controls -->
          <div class="flex items-center gap-2">
            <div
              class="bg-white/90 rounded-full px-2.5 py-1 shadow-md flex items-center gap-1 text-xs font-display font-bold text-amber-500"
            >
              <i class="fa-solid fa-star text-yellow-400"></i>
              <span id="score-value">0</span>
              <span id="combo-badge" class="text-[10px] text-gray-400">x1</span>
            </div>
            <button
              id="stop-btn"
              aria-label="หยุด"
              class="w-8 h-8 rounded-full bg-white text-purpleDark flex items-center justify-center shadow-md hover:bg-gray-100 transition"
            >
              <i class="fa-solid fa-pause text-xs"></i>
            </button>
          </div>
        </div>

        <!-- LAYER 2: BOSS HP BAR -->
        <div class="w-full z-20 relative px-1">
          <div
            class="w-full h-8 bg-black/40 border-2 border-white/80 rounded-full overflow-hidden shadow-md relative flex items-center"
          >
            <div
              id="boss-hp-bar"
              class="h-full bg-bossHp rounded-full"
              style="width: 100%"
            ></div>
            <i
              class="fa-solid fa-dragon text-sm text-white/80 absolute left-2.5 z-10 pointer-events-none"
            ></i>
            <div
              class="absolute inset-0 flex items-center justify-center pointer-events-none"
            >
              <span
                id="boss-hp-text"
                class="font-display font-bold text-white text-xs drop-shadow"
                >100/100</span
              >
            </div>
          </div>
        </div>

        <!-- Spacer -->
        <div class="h-36 md:h-40 w-full"></div>
      </div>

      <!-- ===================== MIDDLE SECTION: QUESTION CARD ===================== -->
      <div
        class="speech-bubble bg-white rounded-3xl p-4 md:p-5 shadow-card text-center relative z-30 mb-3"
      >
        <!-- Audio Button Top-Right -->
        <button
          id="play-sound-btn"
          aria-label="ฟังเสียง"
          class="absolute top-3 right-3 w-9 h-9 rounded-full bg-red-50 hover:bg-red-100 text-pink-500 flex items-center justify-center transition"
        >
          <i class="fa-solid fa-volume-high text-sm"></i>
        </button>

        <!-- Question Image -->
        <div class="flex justify-center my-2">
          <img
            id="question-image"
            src=""
            alt=""
            class="max-h-36 md:max-h-44 w-auto object-contain drop-shadow-md rounded-xl transition-all duration-200 hidden"
          />
        </div>

        <!-- Question Text -->
        <p
          id="question-hanzi"
          class="font-hanzi text-3xl md:text-4xl font-bold text-gray-800 mb-0.5"
        >
          两点
        </p>
        <p
          id="question-pinyin"
          class="text-xs md:text-sm font-thai text-gray-500 mb-3"
        >
          Liǎng diǎn
        </p>

        <!-- Form Input & Submit -->
        <form id="answer-form" class="flex flex-col items-center gap-2 mb-3">
          <input
            type="text"
            id="answer-input"
            placeholder="พิมพ์คำตอบที่นี่...."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            class="w-full text-center font-thai text-sm md:text-base border-2 border-mintDeep/60 rounded-xl px-3 py-1.5 outline-none focus:border-mintDeep bg-white"
          />

          <button
            type="submit"
            id="submit-btn"
            class="font-display font-bold bg-mintDeep hover:bg-emerald-400 text-white rounded-full px-8 py-1.5 text-sm shadow-btn transition hover:scale-105 active:scale-95"
          >
            ตอบ
          </button>
        </form>

        <!-- Feedback Banner / Answer Reveal -->
        <div
          id="feedback-box"
          class="hidden mt-3 rounded-xl px-3 py-2 font-thai text-xs md:text-sm items-center justify-center gap-1.5"
        ></div>
      </div>

      <!-- Timer Bar -->
      <div
        class="w-full h-2 bg-black/20 rounded-full overflow-hidden mb-3 relative z-30"
      >
        <div
          id="timer-bar"
          class="h-full bg-yellowBar rounded-full"
          style="width: 100%"
        ></div>
      </div>

      <!-- ===================== BOTTOM SECTION: PLAYER CARD ===================== -->
      <div class="bg-white rounded-2xl p-3 shadow-card relative z-30">
        <div class="flex items-center justify-between mb-2">
          <!-- Player Profile -->
          <div class="flex items-center gap-2">
            <div
              class="w-8 h-8 rounded-full bg-amber-100 border border-amber-300 flex items-center justify-center text-base overflow-hidden"
            >
              🐼
            </div>
            <span
              id="player-display-name"
              class="font-display font-bold text-gray-700 text-xs md:text-sm"
              >Panda</span
            >
          </div>

          <!-- Helper Items -->
          <div class="flex items-center gap-2">
            <div class="relative">
              <button
                data-item="heal"
                aria-label="ฮีล"
                class="icon-btn w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs"
              >
                <i class="fa-solid fa-flask"></i>
              </button>
              <span
                id="item-heal-count"
                class="absolute -top-1 -right-1 font-display text-[9px] bg-mintDeep text-white rounded-full w-3.5 h-3.5 flex items-center justify-center font-bold"
                >1</span
              >
            </div>

            <div class="relative">
              <button
                data-item="hint"
                aria-label="คำใบ้"
                class="icon-btn w-7 h-7 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center text-xs"
              >
                <i class="fa-solid fa-code-branch"></i>
              </button>
              <span
                id="item-hint-count"
                class="absolute -top-1 -right-1 font-display text-[9px] bg-sky-400 text-white rounded-full w-3.5 h-3.5 flex items-center justify-center font-bold"
                >1</span
              >
            </div>

            <div class="relative">
              <button
                data-item="skip"
                aria-label="ข้าม"
                class="icon-btn w-7 h-7 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xs"
              >
                <i class="fa-solid fa-forward font-bold"></i>
              </button>
              <span
                id="item-skip-count"
                class="absolute -top-1 -right-1 font-display text-[9px] bg-amber-400 text-white rounded-full w-3.5 h-3.5 flex items-center justify-center font-bold"
                >1</span
              >
            </div>
          </div>
        </div>

        <!-- Player HP Bar -->
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-heart text-playerHp text-sm"></i>
          <div
            class="relative w-full h-6 bg-gray-200 border-2 border-gray-700 rounded-full overflow-hidden"
          >
            <div
              id="player-hp-bar"
              class="h-full bg-playerHp rounded-full"
              style="width: 100%"
            ></div>
            <div class="absolute inset-0 flex items-center justify-center">
              <span
                id="player-hp-text"
                class="font-display font-bold text-white text-[11px] drop-shadow"
                >100/100</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================== OVERLAYS ===================== -->
    <div id="damage-overlay"></div>
    <div
      id="combo-container"
      class="fixed inset-0 flex items-center justify-center pointer-events-none z-[90] hidden"
    >
      <div
        id="combo-text"
        class="font-display font-black text-6xl md:text-7xl text-yellow-400 drop-shadow-[0_5px_5px_rgba(0,0,0,0.6)] text-center"
        style="-webkit-text-stroke: 2px #d97706"
      >
        COMBO x3!
      </div>
    </div>

    <!-- ===================== CUSTOM POPUP MODAL ===================== -->
    <div
      id="game-modal"
      class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"
    >
      <div
        id="modal-card"
        class="relative w-full max-w-xs md:max-w-sm bg-white rounded-[36px] pt-12 pb-6 px-5 text-center shadow-2xl border-4 border-[#68cbf8] transition-all duration-200 scale-100"
      >
        <div
          id="modal-ribbon"
          class="absolute -top-7 left-1/2 -translate-x-1/2 w-[82%] py-2 bg-[#68cbf8] border-2 border-white rounded-2xl shadow-md flex items-center justify-center before:content-[''] before:absolute before:top-2 before:-left-5 before:w-6 before:h-full before:bg-[#46b3e3] before:-z-10 before:rounded-l-md before:[clip-path:polygon(100%_0,0_0,40%_50%,0_100%,100%_100%)] after:content-[''] after:absolute after:top-2 after:-right-5 after:w-6 after:h-full after:bg-[#46b3e3] after:-z-10 after:rounded-r-md after:[clip-path:polygon(0_0,100%_0,60%_50%,100%_100%,0_100%)]"
        >
          <span
            id="modal-ribbon-text"
            class="font-display font-extrabold text-2xl md:text-3xl text-white tracking-wider uppercase drop-shadow-[0_2px_2px_rgba(0,0,0,0.15)]"
            >BRAKE TIME</span
          >
        </div>

        <div class="flex justify-center items-center my-3 h-28">
          <img
            id="modal-panda-img"
            src="public/Alert/2.png"
            alt="Panda Status"
            onerror="this.style.display = 'none'"
            class="h-full object-contain drop-shadow-md"
          />
        </div>

        <h3
          id="modal-title"
          class="font-display font-extrabold text-2xl md:text-3xl text-[#4b4b4b] mb-2"
        >
          หยุดชั่วคราว
        </h3>

        <div class="flex justify-center mb-5">
          <div
            id="modal-subtitle-box"
            class="bg-[#eef9ed] rounded-full px-5 py-1.5 inline-block"
          >
            <p
              id="modal-subtitle"
              class="font-thai text-xs md:text-sm text-[#618a66] font-semibold"
            >
              บางทีการพักก็ทำให้ดีขึ้น
            </p>
          </div>
        </div>

        <div
          id="modal-stats"
          class="bg-emerald-50 rounded-2xl py-1.5 px-4 mb-4 text-xs font-thai text-emerald-800 font-semibold hidden"
        >
          ปราบบอสได้ <span id="modal-boss-count">0/5</span> • คะแนน
          <span id="modal-score">0</span>
        </div>

        <div id="modal-actions" class="flex gap-3 justify-center mt-2">
          <button
            id="modal-btn-home"
            class="flex-1 py-2.5 px-4 rounded-2xl font-display font-extrabold text-white bg-[#58cbf5] hover:bg-[#45bce7] active:translate-y-0.5 shadow-[0_4px_0_#3aa1c7] transition text-sm md:text-base"
          >
            กลับหน้าแรก
          </button>
          <button
            id="modal-btn-primary"
            class="flex-1 py-2.5 px-4 rounded-2xl font-display font-extrabold text-white bg-[#ff6f9f] hover:bg-[#f05a8c] active:translate-y-0.5 shadow-[0_4px_0_#d84674] transition text-sm md:text-base"
          >
            เล่นต่อ
          </button>
        </div>
      </div>
    </div>

    <script>
      const bossData = [

            },
            {
              qHanzi: "现在几点？",

        bossProgress: document.getElementById("boss-progress"),
        bossName: document.getElementById("boss-name"),
        bossImage: document.getElementById("boss-image"),
        bossHpBar: document.getElementById("boss-hp-bar"),
        bossHpText: document.getElementById("boss-hp-text"),
        playerHpBar: document.getElementById("player-hp-bar"),
        playerHpText: document.getElementById("player-hp-text"),
        timerBar: document.getElementById("timer-bar"),
        questionImage: document.getElementById("question-image"),
        questionHanzi: document.getElementById("question-hanzi"),
        questionPinyin: document.getElementById("question-pinyin"),
        playSoundBtn: document.getElementById("play-sound-btn"),
        answerForm: document.getElementById("answer-form"),
        answerInput: document.getElementById("answer-input"),
        feedbackBox: document.getElementById("feedback-box"),
        itemHealCount: document.getElementById("item-heal-count"),
        itemHintCount: document.getElementById("item-hint-count"),
        itemSkipCount: document.getElementById("item-skip-count"),
        scoreValue: document.getElementById("score-value"),
        comboBadge: document.getElementById("combo-badge"),
      };

      function normalize(str) {
        return str.trim().replace(/\s+/g, " ");
      }

      /* ========== เอฟเฟกต์ที่เพิ่มใหม่ ========== */
      function showDamageEffect() {
        const overlay = document.getElementById("damage-overlay");
        overlay.classList.add("active");
        setTimeout(() => overlay.classList.remove("active"), 300);
      }

      function showComboEffect(combo) {
        const container = document.getElementById("combo-container");
        const text = document.getElementById("combo-text");

        text.textContent = `COMBO x${combo}!`;
        container.classList.remove("hidden");
        text.classList.remove("combo-animate");
        void text.offsetWidth;
        text.classList.add("combo-animate");

        setTimeout(() => container.classList.add("hidden"), 1200);
      }
      /* ======================================= */

      function speak(text) {
        if (!("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "zh-CN";
        utter.rate = 0.85;
        speechSynthesis.speak(utter);
      }

      function updatePlayerHP() {
        const hp = Math.max(state.playerHP, 0);
        el.playerHpBar.style.width = hp + "%";
        el.playerHpText.textContent = `${hp}/100`;
      }

      function updateBossHP() {
        const hp = Math.max(state.bossHP, 0);
        el.bossHpBar.style.width = hp + "%";
        el.bossHpText.textContent = `${hp}/100`;
      }

      function updateScoreUI() {
        el.scoreValue.textContent = state.score;
        el.comboBadge.textContent = `x${state.scoreMultiplier}`;
      }

      function updateItemUI() {
        el.itemHealCount.textContent = state.items.heal;
        el.itemHintCount.textContent = state.items.hint;
        el.itemSkipCount.textContent = state.items.skip;
        document.querySelectorAll("[data-item]").forEach((btn) => {
          const type = btn.getAttribute("data-item");
          btn.disabled = state.items[type] <= 0 || state.answered;
        });
      }

      function shakeScreen() {
        el.container.classList.add("shake");
        setTimeout(() => el.container.classList.remove("shake"), 400);
      }

      function hitBoss() {
        el.bossImage.classList.add("hit");
        setTimeout(() => el.bossImage.classList.remove("hit"), 350);
      }

      function showFeedback(correct, correctAnswer) {
        el.feedbackBox.classList.remove(
          "hidden",
          "bg-emerald-100",
          "text-emerald-700",
          "bg-rose-100",
          "text-rose-700",
        );
        el.feedbackBox.classList.add(
          "flex",
          "rounded-xl",
          "px-3",
          "py-2",
          "font-thai",
          "text-xs",
          "md:text-sm",
          "items-center",
          "justify-center",
          "gap-1.5",
        );

        if (correct) {
          el.feedbackBox.classList.add("bg-emerald-100", "text-emerald-800");
          el.feedbackBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> ถูกต้อง!`;
        } else {
          el.feedbackBox.classList.add("bg-rose-100", "text-rose-800");
          el.feedbackBox.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-500"></i> เฉลย: "${correctAnswer}"`;
        }
      }

      function hideFeedback() {
        el.feedbackBox.classList.add("hidden");
        el.feedbackBox.classList.remove(
          "flex",
          "bg-emerald-100",
          "text-emerald-800",
          "bg-rose-100",
          "text-rose-800",
        );
        el.feedbackBox.innerHTML = "";
      }

      function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      // ฟังก์ชั่นอัปเดตสีและภาพ Background ตามธีมของบอส
      function updateBossTheme(boss) {
        document.body.style.backgroundColor = boss.bgColor || "#9871FA";

        const circle = boss.circleColor || "rgba(255, 255, 255, 0.15)";
        const patternGradient = `
    radial-gradient(circle at 20% 20%, ${circle} 8%, transparent 8%),
    radial-gradient(circle at 80% 30%, ${circle} 12%, transparent 12%),
    radial-gradient(circle at 15% 65%, ${circle} 15%, transparent 15%),
    radial-gradient(circle at 85% 75%, ${circle} 10%, transparent 10%)
  `;

        if (boss.bgImage) {
          document.body.style.backgroundImage = `${patternGradient}, url('${boss.bgImage}')`;
        } else {
          document.body.style.backgroundImage = patternGradient;
        }
      }

      function loadBoss(index) {
        state.bossIndex = index;
        const boss = bossData[index];

        // อัปเดต Theme สีภาพและลวดลายของด่าน
        updateBossTheme(boss);

        state.bossHP = 100;
        state.answered = false;

        state.currentQuestions = shuffleArray(boss.questions);
        state.questionIndex = 0;

        el.bossProgress.textContent = index + 1;
        el.bossName.textContent = boss.name;

        el.bossImage.src = `${boss.image}?v=${Date.now()}`;
        el.bossImage.onerror = () => {
          el.bossImage.onerror = null;
          el.bossImage.src = `public/1.png?v=${Date.now()}`;
        };

        updateBossHP();
        loadQuestion();
      }

      function checkOutcomeThenNext() {
        setTimeout(() => {
          if (state.playerHP <= 0) return gameOver();
          if (state.bossHP <= 0) return bossDefeated();

          state.questionIndex++;

          if (state.questionIndex >= state.currentQuestions.length) {
            const boss = bossData[state.bossIndex];
            state.currentQuestions = shuffleArray(boss.questions); // สุ่ม 15 ข้อใหม่อีกรอบ
            state.questionIndex = 0;
          }

          loadQuestion();
        }, 1200);
      }

      function loadQuestion() {
        state.answered = false;
        state.hintUsedThisQuestion = false;
        hideFeedback();

        const q = state.currentQuestions[state.questionIndex];

        el.questionHanzi.textContent = q.qHanzi;
        el.questionPinyin.textContent = q.qPinyin;

        const imagePath = q.image || q.questionImage || "";
        if (imagePath) {
          el.questionImage.src = `${imagePath}?v=${Date.now()}`;
          el.questionImage.alt = q.aHanzi;
          el.questionImage.classList.remove("hidden");
        } else {
          el.questionImage.src = "";
          el.questionImage.classList.add("hidden");
        }

        el.answerInput.value = "";
        el.answerInput.disabled = false;
        el.answerInput.classList.remove("ring-correct", "ring-wrong");
        el.answerInput.focus();

        updateItemUI();
        updateScoreUI();
        startTimer();
      }

      function startTimer() {
        clearInterval(state.timer);
        state.timeLeft = QUESTION_TIME;
        el.timerBar.style.width = "100%";

        state.timer = setInterval(() => {
          if (state.paused) return;
          state.timeLeft -= 0.1;
          const pct = Math.max((state.timeLeft / QUESTION_TIME) * 100, 0);
          el.timerBar.style.width = pct + "%";

          if (state.timeLeft <= 0) {
            clearInterval(state.timer);
            if (!state.answered) handleTimeout();
          }
        }, 100);
      }

      function handleTimeout() {
        const q = state.currentQuestions[state.questionIndex];
        state.answered = true;
        el.answerInput.disabled = true;
        el.answerInput.classList.add("ring-wrong");
        state.playerHP -= WRONG_DAMAGE;

        state.comboCount = 0;
        state.scoreMultiplier = 1;
        updateScoreUI();

        updatePlayerHP();
        shakeScreen();
        showDamageEffect();
        showFeedback(false, q.aHanzi);
        updateItemUI();
        checkOutcomeThenNext();
      }

      function submitAnswer(typed) {
        if (state.answered) return;
        const q = state.currentQuestions[state.questionIndex];
        state.answered = true;
        clearInterval(state.timer);
        el.answerInput.disabled = true;

        const isCorrect = normalize(typed) === normalize(q.aHanzi);

        if (isCorrect) {
          el.answerInput.classList.add("ring-correct");
          state.bossHP -= DAMAGE_PER_HIT;

          state.comboCount++;
          if (state.comboCount >= 3) {
            showComboEffect(state.comboCount);
          }
          state.scoreMultiplier =
            state.comboCount >= 5 ? 3 : state.comboCount >= 3 ? 2 : 1;
          state.score += 100 * state.scoreMultiplier;

          updateScoreUI();
          updateBossHP();
          hitBoss();
          showFeedback(true, q.aHanzi);
        } else {
          el.answerInput.classList.add("ring-wrong");
          state.playerHP -= WRONG_DAMAGE;

          state.comboCount = 0;
          state.scoreMultiplier = 1;
          updateScoreUI();

          updatePlayerHP();
          shakeScreen();
          showDamageEffect();
          showFeedback(false, q.aHanzi);
        }

        updateItemUI();
        checkOutcomeThenNext();
      }

      el.answerForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (state.answered) return;
        submitAnswer(el.answerInput.value);
      });

      /* ==========================================================================
   POPUP MODAL SYSTEM
   ========================================================================== */
      function showGameModal(config) {
        const modal = document.getElementById("game-modal");
        const card = document.getElementById("modal-card");
        const ribbon = document.getElementById("modal-ribbon");
        const ribbonText = document.getElementById("modal-ribbon-text");
        const pandaImg = document.getElementById("modal-panda-img");
        const title = document.getElementById("modal-title");
        const subtitle = document.getElementById("modal-subtitle");
        const statsBox = document.getElementById("modal-stats");
        const btnHome = document.getElementById("modal-btn-home");
        const btnPrimary = document.getElementById("modal-btn-primary");

        const themes = {
          pause: {
            ribbonClass: "bg-sky-400 border-sky-200",
            cardBorder: "border-sky-300",
            ribbonText: "BRAKE TIME",
            pandaImg: "public/Alert/2.png",
            title: "หยุดชั่วคราว",
            subtitle: "บางทีการพักก็ทำให้ดีขึ้น",
            showStats: false,
            btnPrimaryText: "เล่นต่อ",
            btnPrimaryBg:
              "bg-pink-400 hover:bg-pink-500 shadow-[0_4px_0_#db2777]",
            btnHomeShow: true,
          },
          gameover: {
            ribbonClass: "bg-rose-500 border-rose-300",
            cardBorder: "border-rose-400",
            ribbonText: "GAME OVER",
            pandaImg: "public/Alert/1.png",
            title: "พ่ายแพ้!",
            subtitle: "พลังชีวิตหมดแล้ว ลองอีกครั้งนะ!",
            showStats: true,
            btnPrimaryText: "ลองอีกครั้ง",
            btnPrimaryBg:
              "bg-pink-400 hover:bg-pink-500 shadow-[0_4px_0_#db2777]",
            btnHomeShow: true,
          },
          win: {
            ribbonClass: "bg-emerald-500 border-emerald-300",
            cardBorder: "border-emerald-400",
            ribbonText: "YOU WIN",
            pandaImg: "public/Alert/3.png",
            title: "ชนะแล้ว",
            subtitle: "คุณเก่งมากยินดีด้วย",
            showStats: true,
            btnPrimaryText: "กลับหน้าแรก",
            btnPrimaryBg:
              "bg-emerald-500 hover:bg-emerald-600 shadow-[0_4px_0_#15803d]",
            btnHomeShow: false,
          },
          defeated: {
            ribbonClass: "bg-emerald-500 border-emerald-300",
            cardBorder: "border-emerald-400",
            ribbonText: "Boss defeated",
            pandaImg: "public/Alert/4.png",
            title: "ผ่านแล้ว",
            subtitle: "ไปกินต่อผู้สู้ต่อไป",
            showStats: true,
            btnPrimaryText: "ไปต่อ",
            btnPrimaryBg:
              "bg-emerald-500 hover:bg-emerald-600 shadow-[0_4px_0_#15803d]",
            btnHomeShow: false,
          },
        };

        const theme = themes[config.type];

        ribbon.className = `absolute -top-7 left-1/2 -translate-x-1/2 w-[85%] py-2.5 px-4 rounded-2xl shadow-lg flex items-center justify-center border-2 ${theme.ribbonClass}`;
        card.className = `relative w-full max-w-xs md:max-w-sm bg-white rounded-[32px] pt-12 pb-6 px-5 text-center shadow-2xl border-4 ${theme.cardBorder} transition-all duration-200 scale-100`;
        ribbonText.textContent = theme.ribbonText;
        pandaImg.src = `${theme.pandaImg}?v=${Date.now()}`;
        title.textContent = theme.title;
        subtitle.textContent = theme.subtitle;

        if (theme.showStats) {
          statsBox.classList.remove("hidden");
          document.getElementById("modal-boss-count").textContent =
            `${state.bossIndex}/5`;
          document.getElementById("modal-score").textContent = `${state.score}`;
        } else {
          statsBox.classList.add("hidden");
        }

        btnPrimary.textContent = theme.btnPrimaryText;
        btnPrimary.className = `flex-1 py-2.5 px-4 rounded-2xl font-display font-bold text-white transition text-sm active:translate-y-0.5 ${theme.btnPrimaryBg}`;

        if (theme.btnHomeShow) {
          btnHome.classList.remove("hidden");
        } else {
          btnHome.classList.add("hidden");
        }

        btnHome.onclick = () => {
          window.location.href = "index.html";
        };

        btnPrimary.onclick = () => {
          modal.classList.add("hidden");
          if (config.onPrimary) config.onPrimary();
        };

        modal.classList.remove("hidden");
      }

      function pauseGame() {
        state.paused = true;
        clearInterval(state.timer);
        showGameModal({
          type: "pause",
          onPrimary: () => {
            state.paused = false;
            startTimer();
          },
        });
      }

      function bossDefeated() {
        const next = state.bossIndex + 1;
        if (next >= TOTAL_BOSSES) {
          victory();
        } else {
          showGameModal({
            type: "defeated",
            onPrimary: () => {
              loadBoss(next);
            },
          });
        }
      }

      function gameOver() {
        clearInterval(state.timer);
        showGameModal({
          type: "gameover",
          onPrimary: () => {
            location.reload();
          },
        });
      }

      function victory() {
        showGameModal({
          type: "win",
          onPrimary: () => {
            window.location.href = "index.html";
          },
        });
      }

      document.querySelectorAll("[data-item]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const type = btn.getAttribute("data-item");
          if (state.items[type] <= 0 || state.answered) return;

          if (type === "heal") {
            state.items.heal--;
            state.playerHP = Math.min(state.playerHP + HEAL_AMOUNT, 100);
            updatePlayerHP();
          }

          if (type === "hint" && !state.hintUsedThisQuestion) {
            state.items.hint--;
            state.hintUsedThisQuestion = true;
            const q = state.currentQuestions[state.questionIndex];
            el.answerInput.value = q.aHanzi.charAt(0);
            el.answerInput.focus();
            const len = el.answerInput.value.length;
            el.answerInput.setSelectionRange(len, len);
          }

          if (type === "skip") {
            state.items.skip--;
            state.answered = true;
            clearInterval(state.timer);
            el.answerInput.disabled = true;
            checkOutcomeThenNext();
          }

          updateItemUI();
        });
      });

      document.getElementById("stop-btn").addEventListener("click", pauseGame);

      el.playSoundBtn.addEventListener("click", () => {
        speak(el.questionHanzi.textContent);
      });

      updatePlayerHP();
      updateItemUI();
      loadBoss(0);
    </script>

    <script>
      window.GAME_LEVEL = "Normal";
    </script>
    <script src="game-enhancements.js"></script>
  </body>
</html>
