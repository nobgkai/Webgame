  tailwind.config = {

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background-color: #f0f0f0;
  }
  body {
    font-family:'Mali',sans-serif;
    color:#3A3355;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* =========================================================
     AMBIENT BACKGROUND 
  ========================================================= */
  .ambient-bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: #8A4AF3;
  }
  
  .bg-bubble {
    position: absolute; border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    pointer-events: none;
    animation: float-complex ease-in-out infinite alternate;
  }
  
  .bubble-1 { width: 50vh; height: 50vh; top: -10%; left: -10%; animation-duration: 12s; }
  .bubble-2 { width: 35vh; height: 35vh; top: 15%; right: -5%; animation-duration: 15s; animation-delay: -2s; }
  .bubble-3 { width: 65vh; height: 65vh; bottom: -20%; left: 5%; animation-duration: 18s; animation-delay: -5s; }
  .bubble-4 { width: 25vh; height: 25vh; top: 40%; left: 65%; animation-duration: 10s; animation-delay: -1s; }
  .bubble-5 { width: 40vh; height: 40vh; bottom: 10%; right: -15%; animation-duration: 14s; animation-delay: -7s; }
  .bubble-6 { width: 20vh; height: 20vh; top: 50%; left: 20%; animation-duration: 9s; animation-delay: -3s; }
  .bubble-7 { width: 30vh; height: 30vh; top: -5%; left: 40%; animation-duration: 11s; animation-delay: -4s; }
  .bubble-8 { width: 15vh; height: 15vh; bottom: 30%; right: 25%; animation-duration: 8s; animation-delay: -6s; }

  @keyframes float-complex {
    0%   { transform: translate(0px, 0px) scale(1); }
    33%  { transform: translate(25px, -30px) scale(1.05); }
    66%  { transform: translate(-20px, 20px) scale(0.95); }
    100% { transform: translate(30px, 35px) scale(1.1); }
  }

  /* =========================================================
     GAME FRAME
  ========================================================= */
  .app-frame {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100dvh;
    max-width: 480px;
    margin: auto;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  @media (min-width: 640px) {
    .app-frame {
      height: min(94dvh, 900px);
      border-radius: 1.75rem;
    }
  }

  /* Timer fill uses transform scaling to avoid percentage width overrides */
  #timer-bar {
    transform-origin: left center;
    transform: scaleX(1);
    transition: transform .06s linear, background-color .12s ease;
    will-change: transform;
    width: 100%;
    background: linear-gradient(90deg, #facc15, #f59e0b);
  }

  /* =========================================================
     FULL SCREEN DAMAGE EFFECT
  ========================================================= */
  body.app-damage::before {
    content: '';
    position: fixed; 
    left: 0; right: 0; top: 0; bottom: 0;
    pointer-events: none; 
    z-index: 9999; 
    opacity: 0;
    box-shadow: inset 0 0 120px rgba(239, 68, 68, 0.7);
    transition: opacity .25s ease;
    animation: damage-pulse-screen 0.9s ease-out both;
  }
  @keyframes damage-pulse-screen { 
    0% { opacity: 0; } 
    10% { opacity: 1; } 
    80% { opacity: 1; } 
    100% { opacity: 0; } 
  }

  /* =========================================================
     BOSS ZONE 
  ========================================================= */
  #boss-image {
    animation: floaty 3.5s ease-in-out infinite;
    width: clamp(17rem, 45dvh, 28rem);
    height: clamp(17rem, 45dvh, 28rem);
    object-fit: contain;
  }
  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
  
  .boss-shake { animation: boss-hit-shake .35s ease; }
  @keyframes boss-hit-shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* =========================================================
     SPEECH BUBBLE
  ========================================================= */
  .speech-bubble {
    position: relative;
    background: #FFFFFF;
    border-radius: 1.5rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }
  .speech-bubble::before {
    content: ''; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 16px solid #FFFFFF;
  }

  /* =========================================================
     CHOICES
  ========================================================= */
  .choice-btn {
    transition: transform .12s ease, filter .12s ease;
    background: #FFFFFF;
    border-radius: 1rem;
    font-size: clamp(.85rem, 2.2dvh, 1rem);
    color: #4B5563;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .choice-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); filter: brightness(0.98); }
  .choice-btn:active:not(:disabled) { transform: translateY(1px); }
  .choice-btn:disabled { opacity: .6; cursor: not-allowed; }
  .choice-correct { background: #10B981 !important; color: white !important; box-shadow: 0 6px 15px rgba(16,185,129,0.4) !important; }
  .choice-wrong { background: #EF4444 !important; color: white !important; box-shadow: 0 6px 15px rgba(239,68,68,0.4) !important; }

  /* =========================================================
     PLAYER ZONE 
  ========================================================= */
  .player-panel {
    background: #FFFFFF;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
  }
  .player-panel.damage-hit {
    animation: player-panel-shake .45s ease;
    border-color: #EF4444 !important;
  }
  .player-panel.damage-hit::before {
    content: ''; position: absolute; inset: -2px; border-radius: inherit;
    background: rgba(239, 68, 68, 0.15);
    box-shadow: 0 0 20px 5px rgba(239, 68, 68, 0.6);
    animation: player-panel-flash .45s ease;
    pointer-events: none; z-index: 1;
  }
  
  @keyframes player-panel-shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-8px) rotate(-1deg); }
    30% { transform: translateX(7px) rotate(1deg); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
  }
  @keyframes player-panel-flash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

  /* OVERLAY */
  .overlay {
    position: absolute; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay-card {
    background: white; border-radius: 1.5rem; padding: 2rem 1.5rem 1.5rem;
    width: 85%; max-width: 300px; text-align: center;
    transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .overlay.show .overlay-card { transform: scale(1); }

  /* FLAT UI */
  .shadow, .shadow-sm, .shadow-md, .shadow-lg, .shadow-inner, .drop-shadow-2xl, .drop-shadow-md, .drop-shadow-sm {
    box-shadow: none !important;
    filter: none !important;
  }
  .speech-bubble, .player-panel, .status-chip, .overlay-card, .choice-btn, .app-frame, #boss-image, .vessel, .vessel-fill, .digital-clock {
    box-shadow: none !important;
    filter: none !important;
  }
  .shadow-inner { box-shadow: none !important; }
  .overlay { background: rgba(0,0,0,0.24) !important; backdrop-filter: none !important; }
</style>
</head>

<script>
/* =========================================================
   DATA & CONFIG
========================================================= */
const bossData = [
  {
    id: 1, name: 'จอมเวลา ปีศาจนาฬิกา', hp: 100,
    bossImage: 'public/1.png',
    questions: [
      { hanzi: '一点', pinyin: 'yī diǎn', meaning: 'ตีหนึ่ง', isClock: true, time: '01:00', questionImage: 'public/Clock/01_00.png' },
      { hanzi: '两点', pinyin: 'liǎng diǎn', meaning: 'สองนาฬิกา', isClock: true, time: '02:00', questionImage: 'public/Clock/02_00.png' },
      { hanzi: '三点半', pinyin: 'sān diǎn bàn', meaning: 'สามโมงครึ่ง', isClock: true, time: '03:30', questionImage: 'public/Clock/03_30.png' },
      { hanzi: '十分', pinyin: 'shí fēn', meaning: 'สิบนาที', isClock: true, time: '00:10', questionImage: 'public/Clock/10minutes.png' },
      { hanzi: '五点十分', pinyin: 'wǔ diǎn shí fēn', meaning: 'ห้าโมงสิบนาที', isClock: true, time: '05:10', questionImage: 'public/Clock/05_10.png' },
    ]
  },
  {
    id: 2, name: 'ปีศาจปฏิทิน (สัปดาห์)', hp: 100,
    bossImage: 'public/2.png',
    questions: [
      { hanzi: '一月一号', pinyin: 'yī yuè yī hào', meaning: 'วันที่ 1 มกราคม', questionImage: 'public/Calendar/1jan.png' },
      { hanzi: '星期一', pinyin: 'xīngqīyī', meaning: 'วันจันทร์', questionImage: 'public/Calendar/Monday.png' },
      { hanzi: '星期天', pinyin: 'xīngqītiān', meaning: 'วันอาทิตย์', questionImage: 'public/Calendar/Sunday.png' },
      { hanzi: '今天几号', pinyin: 'jīntiān jǐ hào', meaning: 'วันนี้วันที่เท่าไหร่', questionImage: 'public/Calendar/Whatdate.png' },
      { hanzi: '明天', pinyin: 'míngtiān', meaning: 'พรุ่งนี้', questionImage: 'public/Calendar/Tomorrow.png' },
    ]
  },
  {
    id: 3, name: 'ปีศาจปฏิทิน (เดือน)', hp: 100,
    bossImage: 'public/3.png',
    questions: [
      { hanzi: '一月', pinyin: 'yī yuè', meaning: 'เดือนมกราคม', questionImage: 'public/Calendar/January.png' },
      { hanzi: '二月', pinyin: 'èr yuè', meaning: 'เดือนกุมภาพันธ์', questionImage: 'public/Calendar/February.png' },
      { hanzi: '星期几', pinyin: 'xīngqī jǐ', meaning: 'วันอะไร (ของสัปดาห์)', questionImage: 'public/Calendar/WhichDay.png' },
      { hanzi: '下午', pinyin: 'xiàwǔ', meaning: 'ตอนบ่าย', questionImage: 'public/Time/Afternoon.png' },
      { hanzi: '晚上', pinyin: 'wǎnshang', meaning: 'ตอนกลางคืน/ตอนเย็น', questionImage: 'public/Time/Evening.png' },
    ]
  },
  {
    id: 4, name: 'ปีศาจสภาพอากาศ', hp: 100,
    bossImage: 'public/4.png',
    questions: [
      { hanzi: '天气', pinyin: 'tiānqì', meaning: 'สภาพอากาศ', questionImage: 'public/Weather/weather.png' },
      { hanzi: '热', pinyin: 'rè', meaning: 'ร้อน', questionImage: 'public/Weather/hot.png' },
      { hanzi: '冷', pinyin: 'lěng', meaning: 'หนาว', questionImage: 'public/Weather/cold.png' },
      { hanzi: '下雨', pinyin: 'xià yǔ', meaning: 'ฝนตก', questionImage: 'public/Weather/weather.png' },
      { hanzi: '晴天', pinyin: 'qíngtiān', meaning: 'วันที่ท้องฟ้าแจ่มใส', questionImage: 'public/Weather/weather.png' },
    ]
  },
  {
    id: 5, name: 'ปีศาจสถานที่', hp: 100,
    bossImage: 'public/5.png',
    questions: [
      { hanzi: '学校', pinyin: 'xuéxiào', meaning: 'โรงเรียน', questionImage: 'public/Locations/school.png' },
      { hanzi: '医院', pinyin: 'yīyuàn', meaning: 'โรงพยาบาล', questionImage: 'public/Locations/hospital.png' },
      { hanzi: '商店', pinyin: 'shāngdiàn', meaning: 'ร้านค้า', questionImage: 'public/Locations/store.png' },
      { hanzi: '前面', pinyin: 'qiánmiàn', meaning: 'ด้านหน้า', questionImage: 'public/Locations/front.png' },
      { hanzi: '后面', pinyin: 'hòumiàn', meaning: 'ด้านหลัง', questionImage: 'public/Locations/back.png' },
    ]

const FALLBACK_DISTRACTORS = ['เที่ยงคืน', 'เมื่อวาน', 'สัปดาห์หน้า', 'ตอนเช้า', 'ตีสี่', 'เดือนหน้า'];
const TOTAL_BOSSES = bossData.length;
const WRONG_DAMAGE = 20;
const HEAL_AMOUNT = 30;
const GAME_TIME = 15000; // เวลาตั้งต้น 15 วินาที

let state = {
  bossIndex: 0, questionIndex: 0,
  bossHP: 100, bossMaxHP: 100, playerHP: 100,
  score: 0, comboCount: 0, scoreMultiplier: 1, bossesDefeated: 0,
  items: { heal: 1, fifty: 1, skip: 1 },
  currentQuestions: [],
  answered: false, damagePerHit: 25
};

// ระบบเวลาแบบใช้อ้างอิงเวลาจริง (Absolute Time) 
let timerState = {
  reqFrame: null,
  endTime: 0,
  remaining: GAME_TIME,
  isPlaying: false
};

const el = {
  bossName: document.getElementById('boss-name'),
  bossImage: document.getElementById('boss-image'),
  bossHPBar: document.getElementById('boss-hp-bar'),
  bossHPText: document.getElementById('boss-hp-text'),
  playerHPBar: document.getElementById('player-hp-bar'),
  playerHPText: document.getElementById('player-hp-text'),
  playerPanel: document.getElementById('player-panel'),
  scoreValue: document.getElementById('score-value'),
  comboBadge: document.getElementById('combo-badge'),
  questionHanzi: document.getElementById('question-hanzi'),
  questionPinyin: document.getElementById('question-pinyin'),
  questionImage: document.getElementById('question-image'),
  timerBar: document.getElementById('timer-bar'), 
  choicesGrid: document.getElementById('choices-grid'),
  bossProgress: document.getElementById('boss-progress'),
  bossTotal: document.getElementById('boss-total'),
  overlayContainer: document.getElementById('overlay-container')
};

el.bossTotal.textContent = TOTAL_BOSSES;

/* =========================================================
   UTILITIES
========================================================= */
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
function buildMeaningPool() {
  const set = new Set(FALLBACK_DISTRACTORS);
  bossData.forEach(b => b.questions.forEach(q => set.add(q.meaning)));
  return [...set];
}
const MEANING_POOL = buildMeaningPool();

function speak(text) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
  }
}

/* =========================================================
   HP & UI UPDATES
========================================================= */
function updatePlayerHP(delta) {
  const percent = Math.max(0, (state.playerHP / 100) * 100);
  el.playerHPBar.style.width = percent + '%';
  el.playerHPText.textContent = `${Math.max(0, state.playerHP)}/100`;

  if (delta && delta < 0) {
    el.playerPanel.classList.remove('damage-hit');
    void el.playerPanel.offsetWidth;
    el.playerPanel.classList.add('damage-hit');
    
    document.body.classList.remove('app-damage');
    void document.body.offsetWidth;
    document.body.classList.add('app-damage');
    
    setTimeout(() => {
      el.playerPanel.classList.remove('damage-hit');
      document.body.classList.remove('app-damage');
    }, 700);
  }
}

function updateBossHP() {
  const percent = Math.max(0, (state.bossHP / state.bossMaxHP) * 100);
  el.bossHPBar.style.width = percent + '%';
  el.bossHPText.textContent = `${Math.max(0, state.bossHP)}/${state.bossMaxHP}`;
}

function updateScoreUI() {
  el.scoreValue.textContent = state.score;
  el.comboBadge.textContent = `x${state.scoreMultiplier}`;
  el.comboBadge.style.display = state.scoreMultiplier > 1 ? 'inline-block' : 'none';
}

function updateItemUI() {
  ['heal', 'fifty', 'skip'].forEach(type => {
    document.getElementById(`item-${type}-count`).textContent = state.items[type];
    const btn = document.querySelector(`[data-item="${type}"]`);
    if(btn) btn.disabled = state.items[type] <= 0;
  });
}

function hitBoss() {
  el.bossImage.classList.remove('boss-shake');
  void el.bossImage.offsetWidth;
  el.bossImage.classList.add('boss-shake');
}

/* =========================================================
   GAMEPLAY LOGIC
========================================================= */
function loadBoss(index) {
  const boss = bossData[index];
  state.bossIndex = index;
  state.bossHP = boss.hp;
  state.bossMaxHP = boss.hp;
  state.playerHP = 100;
  state.questionIndex = 0;
  state.comboCount = 0;
  state.scoreMultiplier = 1;

  el.bossName.textContent = boss.name;
  el.bossProgress.textContent = (index + 1);
  el.bossImage.src = boss.bossImage || 'https://robohash.org/1?set=set3';
  state.currentQuestions = shuffle(boss.questions);
  state.damagePerHit = Math.ceil(boss.hp / state.currentQuestions.length) || 1;

  updatePlayerHP(); updateBossHP(); updateItemUI(); updateScoreUI();
  loadQuestion();
}

function loadQuestion() {
  state.answered = false;
  el.choicesGrid.innerHTML = '';
  const q = state.currentQuestions[state.questionIndex];

  el.questionHanzi.textContent = q.hanzi;
  el.questionPinyin.textContent = q.pinyin;
  
  if(q.questionImage) {
    el.questionImage.src = q.questionImage;
    el.questionImage.classList.remove('hidden');
  } else {
    el.questionImage.classList.add('hidden');
  }

  const fakeAnswers = shuffle(MEANING_POOL.filter(m => m !== q.meaning)).slice(0, 3);
  const choices = shuffle([q.meaning, ...fakeAnswers]);

  choices.forEach(meaning => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn py-2.5 sm:py-3 font-display font-600 text-[13px] sm:text-sm w-full';
    btn.textContent = meaning;
    btn.onclick = () => handleChoice(btn, q.meaning);
    el.choicesGrid.appendChild(btn);
  });
  
  startTimer();
}

/* =========================================================
   BULLETPROOF TIMER SYSTEM (อิงตามเวลาเครื่อง + requestAnimationFrame)
========================================================= */
function updateClockDisplay() {
  let percent = (timerState.remaining / GAME_TIME) * 100;
  if (percent < 0) percent = 0;
  if (percent > 100) percent = 100;
  
  if (el.timerBar) {
    el.timerBar.style.width = '100%';
    el.timerBar.style.transform = `scaleX(${percent / 100})`;

    if (timerState.remaining <= 5000) {
      el.timerBar.classList.remove('bg-yellow-400');
      el.timerBar.classList.add('bg-red-500');
    } else {
      el.timerBar.classList.remove('bg-red-500');
      el.timerBar.classList.add('bg-yellow-400');
    }
  }
}

function startTimer(isResume = false) {
  if (!isResume) {
    timerState.remaining = GAME_TIME;
  }
  // คำนวณเวลาจบเกมตามเวลาโลก (Date.now())
  timerState.endTime = Date.now() + timerState.remaining;
  timerState.isPlaying = true;
  
  // ยกเลิกเฟรมเดิมถ้ามีการทำงานซ้อนทับ
  cancelAnimationFrame(timerState.reqFrame);

  function tick() {
    if (!timerState.isPlaying) return;
    
    // เวลาที่เหลือ = เวลาจบ - เวลาปัจจุบัน
    timerState.remaining = timerState.endTime - Date.now();
    updateClockDisplay();

    // เช็คหมดเวลา
    if (timerState.remaining <= 0) {
      timerState.remaining = 0;
      timerState.isPlaying = false;
      cancelAnimationFrame(timerState.reqFrame);
      updateClockDisplay();
      
      state.answered = true;
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      
      state.playerHP = Math.max(0, state.playerHP - WRONG_DAMAGE);
      state.comboCount = 0; 
      state.scoreMultiplier = 1;
      updateScoreUI();
      updatePlayerHP(-WRONG_DAMAGE); 
      
      setTimeout(checkOutcome, 1000);
    } else {
      // เรียกตัวเองในเฟรมถัดไป
      timerState.reqFrame = requestAnimationFrame(tick);
    }
  }
  
  // เริ่มต้นลูป
  timerState.reqFrame = requestAnimationFrame(tick);
}

function stopTimer() {
  timerState.isPlaying = false;
  cancelAnimationFrame(timerState.reqFrame);
}

/* =========================================================
   USER ACTIONS
========================================================= */
function handleChoice(btn, correctMeaning) {
  if (state.answered) return;
  state.answered = true;
  stopTimer();
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  if (btn.textContent === correctMeaning) {
    btn.classList.add('choice-correct');
    state.bossHP = Math.max(0, state.bossHP - state.damagePerHit);
    state.comboCount++;
    state.scoreMultiplier = state.comboCount >= 5 ? 3 : (state.comboCount >= 3 ? 2 : 1);
    state.score += 100 * state.scoreMultiplier;
    hitBoss();
    updateBossHP();
  } else {
    btn.classList.add('choice-wrong');
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.textContent === correctMeaning) b.classList.add('choice-correct');
    });
    state.playerHP = Math.max(0, state.playerHP - WRONG_DAMAGE);
    state.comboCount = 0; state.scoreMultiplier = 1;
    updatePlayerHP(-WRONG_DAMAGE); 
  }
  updateScoreUI();
  setTimeout(checkOutcome, 1000);
}

function checkOutcome() {
  if (state.playerHP <= 0) return gameOver();
  if (state.bossHP <= 0) return bossDefeated();

  state.questionIndex++;
  if (state.questionIndex >= state.currentQuestions.length) {
      state.currentQuestions = shuffle(bossData[state.bossIndex].questions);
      state.questionIndex = 0;
  }
  loadQuestion();
}

/* =========================================================
   OVERLAYS
========================================================= */
function showOverlay(opts) {
  const ribbon = document.getElementById('overlay-ribbon');
  ribbon.textContent = opts.ribbon;
  ribbon.className = `absolute -top-4 left-1/2 -translate-x-1/2 px-6 py-1 rounded shadow-md font-bold text-lg uppercase whitespace-nowrap text-white ${opts.ribbonClass}`;
  
  document.getElementById('overlay-icon').innerHTML = opts.icon;
  document.getElementById('overlay-title').textContent = opts.title;
  document.getElementById('overlay-message').textContent = opts.message;
  
  const stats = document.getElementById('overlay-stats');
  if(opts.stats) { stats.innerHTML = opts.stats; stats.classList.remove('hidden'); }
  else { stats.classList.add('hidden'); }
  
  const btnContainer = document.getElementById('overlay-buttons');
  btnContainer.innerHTML = '';
  opts.buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = `py-3 rounded-full font-bold text-sm w-full transition-transform active:scale-95 ${b.class}`;
    btn.textContent = b.text;
    btn.onclick = () => { hideOverlay(); b.action(); };
    btnContainer.appendChild(btn);
  });
  el.overlayContainer.classList.add('show');
}
function hideOverlay() { el.overlayContainer.classList.remove('show'); }

function gameOver() {
  showOverlay({
    ribbon: 'GAME OVER', ribbonClass: 'bg-red-400',
    icon: '💔', title: 'พ่ายแพ้!', message: 'พลังชีวิตหมดแล้ว ลองอีกครั้งนะ!',
    stats: `ปราบได้: <b>${state.bossesDefeated}/${TOTAL_BOSSES}</b> • คะแนน: <b>${state.score}</b>`,
    buttons: [
      { text: 'กลับหน้าแรก', class: 'bg-sky-400 text-white', action: () => location.reload() },
      { text: 'ลองอีกครั้ง', class: 'bg-red-400 text-white', action: () => loadBoss(state.bossIndex) }
    ]
  });
}

function bossDefeated() {
  state.bossesDefeated++;
  const next = state.bossIndex + 1;
  const isWin = next >= TOTAL_BOSSES;
  showOverlay({
    ribbon: isWin ? 'YOU WIN' : 'You defeated', ribbonClass: 'bg-green-500',
    icon: isWin ? '🏆' : '⚔️', title: 'ชนะแล้ว', message: isWin ? 'คุณเก่งมากยินดีด้วย' : 'ไปต่อสู้ต่อไป',
    stats: `ปราบบอสได้ <b>${state.bossesDefeated}/${TOTAL_BOSSES}</b> • คะแนน <b>${state.score}</b>`,
    buttons: [
      isWin 
        ? { text: 'กลับหน้าแรก', class: 'bg-green-500 text-white', action: () => location.reload() }
        : { text: 'ไปต่อ', class: 'bg-green-500 text-white', action: () => loadBoss(next) }
    ]
  });
}

document.getElementById('stop-btn').addEventListener('click', () => {
  if (state.answered) return;
  stopTimer();
  showOverlay({
    ribbon: 'BRAKE TIME', ribbonClass: 'bg-sky-400',
    icon: '⏸️', title: 'หยุดชั่วคราว', message: 'บางทีการพักก็ทำให้ดีขึ้น',
    buttons: [
      { text: 'กลับหน้าแรก', class: 'bg-sky-400 text-white', action: () => location.reload() },
      { text: 'เล่นต่อ', class: 'bg-pink-400 text-white', action: () => startTimer(true) }
    ]
  });
});

/* =========================================================
   ITEMS
========================================================= */
document.querySelectorAll('[data-item]').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.getAttribute('data-item');
    if (state.items[type] <= 0 || state.answered) return;
    state.items[type]--;
    
    if (type === 'heal') {
      state.playerHP = Math.min(state.playerHP + HEAL_AMOUNT, 100);
      updatePlayerHP(0);
    } else if (type === 'fifty') {
      const q = state.currentQuestions[state.questionIndex];
      const wrong = [...document.querySelectorAll('.choice-btn')].filter(b => b.textContent !== q.meaning);
      shuffle(wrong).slice(0, 2).forEach(b => { b.disabled = true; b.style.opacity = '0.3'; });
    } else if (type === 'skip') {
      state.answered = true;
      stopTimer();
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      setTimeout(checkOutcome, 500);
    }
    updateItemUI();
  });
});

document.getElementById('play-sound-btn').addEventListener('click', () => {
  speak(el.questionHanzi.textContent);
});

// Init
loadBoss(0);
</script>
