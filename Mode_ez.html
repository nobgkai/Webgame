<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Mode | Panda's Chinese Quest</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800;900&family=Mali:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          purpleBg: '#9871FA',
          purpleDark: '#7A4FE2',
          bossHp: '#8A32D2',
          playerHp: '#F33B6D',
          mintDeep: '#53D797',
          skyLight: '#90E2FF',
          yellowBar: '#F3CE38',
          ink: '#3A3355',
        },
        fontFamily: { 
          display: ['Fredoka','Mali','sans-serif'], 
          thai: ['Mali','sans-serif'], 
          hanzi: ["'Noto Sans SC'",'sans-serif'] 
        },
        boxShadow: {
          card: '0 8px 20px rgba(0,0,0,0.12)',
          btn: '0 4px 0 rgba(0,0,0,0.15)',

      }

  }
</script>

<style>
  body { 
    font-family: 'Mali', sans-serif; 
    background-color: #9871FA; 
    color: #3A3355;
    transition: background-color 0.5s ease;
  }
  .font-display { font-family: 'Fredoka','Mali',sans-serif; }
  .font-hanzi { font-family: "'Noto Sans SC'",sans-serif; }

  /* Background Circles Pattern & Moving Animation */
  .bg-pattern {
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.15) 8%, transparent 8%),
      radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.15) 12%, transparent 12%),
      radial-gradient(circle at 15% 65%, rgba(255, 255, 255, 0.12) 15%, transparent 15%),
      radial-gradient(circle at 85% 75%, rgba(255, 255, 255, 0.15) 10%, transparent 10%);
    background-size: 100% 100%;
    animation: moveBg 12s ease-in-out infinite alternate;
  }

  @keyframes moveBg {
    0% { background-position: 0px 0px, 0px 0px, 0px 0px, 0px 0px; }
    50% { background-position: 30px -20px, -20px 30px, 25px 25px, -30px -15px; }
    100% { background-position: -20px 25px, 25px -20px, -15px -30px, 20px 20px; }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-12px) rotate(-1deg); }
    40% { transform: translateX(10px) rotate(1deg); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }

  @keyframes hit {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(0.92); filter: brightness(1.6) saturate(2); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .hit { animation: hit 0.35s ease; }

  @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .float-slow { animation: floaty 3.5s ease-in-out infinite; }

  .icon-btn { transition: transform .12s ease; }
  .icon-btn:hover:not(:disabled) { transform: scale(1.08); }
  .icon-btn:active:not(:disabled) { transform: scale(.95); }
  .icon-btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }

  #timer-bar { transition: width 0.1s linear; }
  #boss-hp-bar, #player-hp-bar { transition: width .35s ease; }

  /* SPEECH BUBBLE */
  .speech-bubble { position: relative; }
  .speech-bubble::before {
    content: '';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 15px solid white;
  }

  /* CHOICES STYLING (EASY MODE) */
  .choice-btn {
    transition: all 0.15s ease;
    background: #ffffff;
    border: 2px solid #E5E7EB;
    border-radius: 1rem;
    color: #3A3355;
    box-shadow: 0 4px 0 #E5E7EB;
  }
  .choice-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: #53D797;
    box-shadow: 0 6px 0 #53D797;
  }
  .choice-btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 0 0 #53D797;
  }
  .choice-btn:disabled {
    cursor: not-allowed;
  }
  .choice-correct {
    background: #53D797 !important;
    border-color: #3BB87B !important;
    color: white !important;
    box-shadow: 0 4px 0 #3BB87B !important;
  }
  .choice-wrong {
    background: #F33B6D !important;
    border-color: #D12554 !important;
    color: white !important;
    box-shadow: 0 4px 0 #D12554 !important;
  }

  /* EFFECT: DAMAGE BLUR */
  #damage-overlay {
    position: fixed;
    inset: 0;
    box-shadow: inset 0 0 100px 40px rgba(220, 38, 38, 0.7);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.3s ease-in-out;
  }
  #damage-overlay.active {
    opacity: 1;
  }

  /* EFFECT: COMBO POPUP */
  @keyframes comboPop {
    0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    20% { opacity: 1; transform: scale(1.2) rotate(5deg); }
    40% { transform: scale(1) rotate(0deg); }
    80% { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(0.8) translateY(-40px); }
  }
  .combo-animate {
    animation: comboPop 1.2s ease-out forwards;
  }
</style>
</head>
<body class="min-h-screen bg-pattern flex items-center justify-center p-3 md:p-6 relative overflow-hidden">

<div id="game-container" class="w-full max-w-lg mx-auto relative select-none pt-2">

  <!-- ===================== MIDDLE SECTION: QUESTION CARD ===================== -->

    <!-- Question Image -->
    <div class="flex justify-center my-2">

    <!-- Question Text -->
    <p id="question-hanzi" class="font-hanzi text-3xl md:text-4xl font-bold text-gray-800 mb-0.5"></p>

    <!-- CHOICES GRID -->
    <div id="choices-grid" class="grid grid-cols-2 gap-2 mt-2"></div>
  </div>

  <!-- Timer Bar -->
  <div class="w-full h-2 bg-black/20 rounded-full overflow-hidden mb-3 relative z-30">
    <div id="timer-bar" class="h-full bg-yellowBar rounded-full" style="width:100%"></div>

  <!-- ===================== BOTTOM SECTION: PLAYER CARD ===================== -->
  <div class="bg-white rounded-2xl p-3 shadow-card relative z-30">
    <div class="flex items-center justify-between mb-2">
      <!-- Player Profile -->
      <div class="flex items-center gap-2">

      <!-- Helper Items -->
      <div class="flex items-center gap-2">
        <div class="relative">
          <button data-item="heal" aria-label="ฮีล" class="icon-btn w-7 h-7 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs">
            <i class="fa-solid fa-flask"></i>
          </button>
          <span id="item-heal-count" class="absolute -top-1 -right-1 font-display text-[9px] bg-mintDeep text-white rounded-full w-3.5 h-3.5 flex items-center justify-center font-bold">1</span>

        <div class="relative">

        <div class="relative">

    <!-- Player HP Bar -->

</div>

<!-- ===================== CUSTOM POPUP MODAL ===================== -->

    <!-- รูปแพนด้า -->

</div>

<!-- ===================== OVERLAYS ===================== -->

<!-- Combo Overlay (ข้อความคอมโบกลางจอ) -->

</div>

<script>
  /* DATA & CONFIG (EASY MODE) - อัปเดตด้วยชุดคำถามใหม่ */
  const bossData = [
    {
      id: 1,
      name: "จอมเวลา (ช่วงที่ 1)",
      hp: 100,
      bossImage: "public/1.png",
      themeColor: "#1E88E5",
      questions: [
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "一点", aPinyin: "yī diǎn", meaning: "1:00", image: "public/Clock/01_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "两点", aPinyin: "liǎng diǎn", meaning: "2:00", image: "public/Clock/02_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "三点", aPinyin: "sān diǎn", meaning: "3:00", image: "public/Clock/03_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "四点", aPinyin: "sì diǎn", meaning: "4:00", image: "public/Clock/04_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "五点", aPinyin: "wǔ diǎn", meaning: "5:00", image: "public/Clock/05_00.png" }
      ],
    },
    {
      id: 2,
      name: "จอมเวลา (ช่วงที่ 2)",
      hp: 100,
      bossImage: "public/2.png",
      themeColor: "#E53935",
      questions: [
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "六点", aPinyin: "liù diǎn", meaning: "6:00", image: "public/Clock/06_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "七点", aPinyin: "qī diǎn", meaning: "7:00", image: "public/Clock/07_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "八点", aPinyin: "bā diǎn", meaning: "8:00", image: "public/Clock/08_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "九点", aPinyin: "jiǔ diǎn", meaning: "9:00", image: "public/Clock/09_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "十点", aPinyin: "shí diǎn", meaning: "10:00", image: "public/Clock/10_00.png" }
      ],
    },
    {
      id: 3,
      name: "จอมเวลา (ช่วงที่ 3)",
      hp: 100,
      bossImage: "public/3.png",
      themeColor: "#43A047",
      questions: [
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "十一点", aPinyin: "shíyī diǎn", meaning: "11:00", image: "public/Clock/11_00.png" },
        { qHanzi: "现在几点？", qPinyin: "xiànzài jǐ diǎn?", aHanzi: "十二点", aPinyin: "shí'èr diǎn", meaning: "12:00", image: "public/Clock/12_00.png" },
        { qHanzi: "这是几分？", qPinyin: "zhè shì jǐ fēn?", aHanzi: "十分", aPinyin: "shí fēn", meaning: "10 นาที", image: "public/Clock/10m.png" },
        { qHanzi: "这是几分？", qPinyin: "zhè shì jǐ fēn?", aHanzi: "二十分", aPinyin: "èrshí fēn", meaning: "20 นาที", image: "public/Clock/20m.png" },
        { qHanzi: "这是几分？", qPinyin: "zhè shì jǐ fēn?", aHanzi: "三十分", aPinyin: "sānshí fēn", meaning: "30 นาที", image: "public/Clock/30m.png" }
      ],
    }
  ];

  const TOTAL_BOSSES = bossData.length;
  const WRONG_DAMAGE = 10;
  const HEAL_AMOUNT = 30;
  const GAME_TIME = 15000;

  let state = {
    bossIndex: 0,
    questionIndex: 0,
    bossHP: 100,
    bossMaxHP: 100,
    playerHP: 100,
    score: 0,
    comboCount: 0,
    scoreMultiplier: 1,
    bossesDefeated: 0,
    items: { heal: 1, fifty: 1, skip: 1 },
    currentQuestions: [],
    answered: false,
    damagePerHit: 25,
    paused: false,
  };

  let timerState = {
    reqFrame: null,
    endTime: 0,
    remaining: GAME_TIME,
    isPlaying: false,
  };

  const el = {
    container: document.getElementById("game-container"),
    bossName: document.getElementById("boss-name"),
    bossImage: document.getElementById("boss-image"),
    bossHPBar: document.getElementById("boss-hp-bar"),
    bossHPText: document.getElementById("boss-hp-text"),
    playerHPBar: document.getElementById("player-hp-bar"),
    playerHPText: document.getElementById("player-hp-text"),
    scoreValue: document.getElementById("score-value"),
    comboBadge: document.getElementById("combo-badge"),
    questionHanzi: document.getElementById("question-hanzi"),
    questionPinyin: document.getElementById("question-pinyin"),
    questionImage: document.getElementById("question-image"),
    timerBar: document.getElementById("timer-bar"),
    choicesGrid: document.getElementById("choices-grid"),
    bossProgress: document.getElementById("boss-progress"),
    bossTotal: document.getElementById("boss-total"),
  };

  el.bossTotal.textContent = TOTAL_BOSSES;

  function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  // ปรับการสร้างชุดคำตอบให้ใช้ ภาษาจีน + พินอิน (แทนคำแปลภาษาไทย)
  function buildChoicePool() {
    const set = new Set();
    bossData.forEach((b) => b.questions.forEach((q) => set.add(q.aHanzi + " (" + q.aPinyin + ")")));
    return [...set];
  }
  const CHOICE_POOL = buildChoicePool();

  let currentLocalAudio = null;
 function speak(text) {
    if (!text) return;
    
    // ตรวจสอบว่าเบราว์เซอร์รองรับหรือไม่
    if ('speechSynthesis' in window) {
      // ยกเลิกเสียงที่กำลังพูดอยู่ (ถ้ามีการกดรัวๆ)
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN'; // ตั้งค่าเป็นภาษาจีน (จีนแผ่นดินใหญ่)
      utterance.rate = 0.85;     // ปรับความเร็ว (1 คือปกติ, < 1 คือช้าลงเพื่อให้ฟังง่ายขึ้น)
      utterance.pitch = 1;      // ระดับเสียง
      
      window.speechSynthesis.speak(utterance);
    } else {
      console.warn("เบราว์เซอร์ของคุณไม่รองรับระบบอ่านออกเสียง");
      alert("ขออภัย เบราว์เซอร์ของคุณไม่รองรับระบบอ่านออกเสียง");
    }
  }

  function showDamageEffect() {
    const overlay = document.getElementById('damage-overlay');
    overlay.classList.add('active');
    setTimeout(() => {
      overlay.classList.remove('active');
    }, 300);
  }

  function showComboEffect(combo) {
    const container = document.getElementById('combo-container');
    const text = document.getElementById('combo-text');
    
    text.textContent = `COMBO x${combo}!`;
    container.classList.remove('hidden');
    
    text.classList.remove('combo-animate');
    void text.offsetWidth;
    text.classList.add('combo-animate');
    
    setTimeout(() => {
      container.classList.add('hidden');
    }, 1200);
  }

  function updatePlayerHP(delta) {
    const hp = Math.max(0, state.playerHP);
    el.playerHPBar.style.width = hp + "%";
    el.playerHPText.textContent = `${hp}/100`;

    if (delta && delta < 0) {
      el.container.classList.add("shake");
      setTimeout(() => el.container.classList.remove("shake"), 400);
    }
  }

  function updateBossHP() {
    const hp = Math.max(0, state.bossHP);
    const percent = (hp / state.bossMaxHP) * 100;
    el.bossHPBar.style.width = percent + "%";
    el.bossHPText.textContent = `${hp}/${state.bossMaxHP}`;
  }

  function updateScoreUI() {
    el.scoreValue.textContent = state.score;
    el.comboBadge.textContent = `x${state.scoreMultiplier}`;
  }

  function updateItemUI() {
    document.getElementById("item-heal-count").textContent = state.items.heal;
    document.getElementById("item-fifty-count").textContent = state.items.fifty;
    document.getElementById("item-skip-count").textContent = state.items.skip;

    ["heal", "fifty", "skip"].forEach((type) => {
      const btn = document.querySelector(`[data-item="${type}"]`);
      if (btn) btn.disabled = state.items[type] <= 0 || state.answered;
    });
  }

  function hitBoss() {
    el.bossImage.classList.add("hit");
    setTimeout(() => el.bossImage.classList.remove("hit"), 350);
  }

  function loadBoss(index) {
    const boss = bossData[index];
    state.bossIndex = index;
    state.bossHP = boss.hp;
    state.bossMaxHP = boss.hp;
    state.playerHP = 100;
    state.questionIndex = 0;

    if (boss.themeColor) {
      document.body.style.backgroundColor = boss.themeColor;
    }

    el.bossName.textContent = boss.name;
    el.bossProgress.textContent = index + 1;
    el.bossImage.src = `${boss.bossImage}?v=${Date.now()}`;
    state.currentQuestions = shuffle(boss.questions);
    state.damagePerHit = Math.ceil(boss.hp / state.currentQuestions.length) || 1;

    updatePlayerHP();
    updateBossHP();
    updateItemUI();
    updateScoreUI();
    loadQuestion();
  }

  function loadQuestion() {
    
    state.answered = false;
    el.choicesGrid.innerHTML = "";
    const q = state.currentQuestions[state.questionIndex];

    // อัปเดตให้รองรับคีย์ qHanzi / qPinyin
    el.questionHanzi.textContent = q.qHanzi;
    el.questionPinyin.textContent = q.qPinyin;

    if (q.image) {
      el.questionImage.src = `${q.image}?v=${Date.now()}`;
      el.questionImage.classList.remove("hidden");
    } else {
      el.questionImage.classList.add("hidden");
    }

    // สร้างตัวเลือก (จีน + พินอิน)
    const correctChoice = q.aHanzi + " (" + q.aPinyin + ")";
    const fakeAnswers = shuffle(CHOICE_POOL.filter((c) => c !== correctChoice)).slice(0, 3);
    const choices = shuffle([correctChoice, ...fakeAnswers]);

   choices.forEach((choiceText) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn py-2 px-2 font-hanzi font-semibold w-full flex flex-col items-center justify-center leading-tight";
      btn.dataset.choice = choiceText; // เก็บค่าที่แท้จริงไว้เปรียบเทียบ

      // แยกข้อความตัวอักษรจีนกับพินอินเพื่อจัดรูปแบบสวยงาม
      const [hanzi, pinyinStr] = choiceText.split(" (");
      const pinyin = pinyinStr ? pinyinStr.replace(")", "") : "";
      
      btn.dataset.hanzi = hanzi; // <-- เพิ่มบรรทัดนี้ เพื่อเก็บอักษรจีนไว้ให้อ่านออกเสียง

      btn.innerHTML = `<span class="mb-0.5 text-base md:text-lg">${hanzi}</span><span class="text-[11px] font-thai opacity-80">${pinyin}</span>`;
      btn.onclick = () => handleChoice(btn, correctChoice);
      el.choicesGrid.appendChild(btn);
    });

    updateItemUI();
    startTimer();
  }

  function updateClockDisplay() {
    let percent = (timerState.remaining / GAME_TIME) * 100;
    if (percent < 0) percent = 0;
    el.timerBar.style.width = percent + "%";
  }

  function startTimer(isResume = false) {
    if (!isResume) {
      timerState.remaining = GAME_TIME;
    }
    timerState.endTime = Date.now() + timerState.remaining;
    timerState.isPlaying = true;
    cancelAnimationFrame(timerState.reqFrame);

    function tick() {
      if (!timerState.isPlaying || state.paused) return;
      timerState.remaining = timerState.endTime - Date.now();
      updateClockDisplay();

      if (timerState.remaining <= 0) {
        timerState.remaining = 0;
        timerState.isPlaying = false;
        cancelAnimationFrame(timerState.reqFrame);
        updateClockDisplay();

        state.answered = true;
        document.querySelectorAll(".choice-btn").forEach((b) => (b.disabled = true));

        state.playerHP = Math.max(0, state.playerHP - WRONG_DAMAGE);
        state.comboCount = 0;
        state.scoreMultiplier = 1;
        updateScoreUI();
        updatePlayerHP(-WRONG_DAMAGE);
        
        showDamageEffect();

        setTimeout(checkOutcome, 1000);
      } else {
        timerState.reqFrame = requestAnimationFrame(tick);
      }
    }
    timerState.reqFrame = requestAnimationFrame(tick);
  }

  function stopTimer() {
    timerState.isPlaying = false;
    cancelAnimationFrame(timerState.reqFrame);
  }

  function handleChoice(btn, correctChoice) {
    if (state.answered) return;
    state.answered = true;
    stopTimer();
    document.querySelectorAll(".choice-btn").forEach((b) => (b.disabled = true));

    // เช็คจาก dataset.choice 
    if (btn.dataset.choice === correctChoice) {
      btn.classList.add("choice-correct");
      state.bossHP = Math.max(0, state.bossHP - state.damagePerHit);
      
      speak(btn.dataset.hanzi);

      state.comboCount++;
      if (state.comboCount >= 3) {
        showComboEffect(state.comboCount);
      }
      
      state.scoreMultiplier = state.comboCount >= 5 ? 3 : state.comboCount >= 3 ? 2 : 1;
      state.score += 100 * state.scoreMultiplier;
      hitBoss();
      updateBossHP();
    } else {
      btn.classList.add("choice-wrong");
      document.querySelectorAll(".choice-btn").forEach((b) => {
        if (b.dataset.choice === correctChoice) b.classList.add("choice-correct");
      });
      state.playerHP = Math.max(0, state.playerHP - WRONG_DAMAGE);
      state.comboCount = 0;
      state.scoreMultiplier = 1;
      updatePlayerHP(-WRONG_DAMAGE);
      
      showDamageEffect();
    }
    updateScoreUI();
    updateItemUI();
    setTimeout(checkOutcome, 1000);
  }

  function checkOutcome() {
    if (state.playerHP <= 0) return gameOver();
    if (state.bossHP <= 0) return bossDefeated();

    state.questionIndex++;
    if (state.questionIndex >= state.currentQuestions.length) {
      state.currentQuestions = shuffle(bossData[state.bossIndex].questions);
      state.questionIndex = 0;
    }
    loadQuestion();
  }

  /* POPUP MODAL SYSTEM */
  function showGameModal(config) {
    const modal = document.getElementById('game-modal');
    const card = document.getElementById('modal-card');
    const ribbon = document.getElementById('modal-ribbon');
    const ribbonText = document.getElementById('modal-ribbon-text');
    const pandaImg = document.getElementById('modal-panda-img');
    const title = document.getElementById('modal-title');
    const subtitle = document.getElementById('modal-subtitle');
    const statsBox = document.getElementById('modal-stats');
    const btnHome = document.getElementById('modal-btn-home');
    const btnPrimary = document.getElementById('modal-btn-primary');

    const themes = {
      pause: {
        ribbonClass: 'bg-sky-400 border-sky-200',
        cardBorder: 'border-sky-300',
        ribbonText: 'BRAKE TIME',
        pandaImg: 'public/Alert/2.png',
        title: 'หยุดชั่วคราว',
        subtitle: 'บางทีการพักก็ทำให้ดีขึ้น',
        showStats: false,
        btnPrimaryText: 'เล่นต่อ',
        btnPrimaryBg: 'bg-pink-400 hover:bg-pink-500 shadow-[0_4px_0_#db2777]',
        btnHomeShow: true
      },
      gameover: {
        ribbonClass: 'bg-rose-500 border-rose-300',
        cardBorder: 'border-rose-400',
        ribbonText: 'GAME OVER',
        pandaImg: 'public/Alert/1.png',
        title: 'พ่ายแพ้!',
        subtitle: 'พลังชีวิตหมดแล้ว ลองอีกครั้งนะ!',
        showStats: true,
        btnPrimaryText: 'ลองอีกครั้ง',
        btnPrimaryBg: 'bg-pink-400 hover:bg-pink-500 shadow-[0_4px_0_#db2777]',
        btnHomeShow: true
      },
      win: {
        ribbonClass: 'bg-emerald-500 border-emerald-300',
        cardBorder: 'border-emerald-400',
        ribbonText: 'YOU WIN',
        pandaImg: 'public/Alert/3.png',
        title: 'ชนะแล้ว',
        subtitle: 'คุณเก่งมากยินดีด้วย',
        showStats: true,
        btnPrimaryText: 'กลับหน้าแรก',
        btnPrimaryBg: 'bg-emerald-500 hover:bg-emerald-600 shadow-[0_4px_0_#15803d]',
        btnHomeShow: false
      },
      defeated: {
        ribbonClass: 'bg-emerald-500 border-emerald-300',
        cardBorder: 'border-emerald-400',
        ribbonText: 'You defeated',
        pandaImg: 'public/Alert/4.png',
        title: 'ผ่านแล้ว',
        subtitle: 'ไปสู้ต่อที่ด่านต่อไป',
        showStats: true,
        btnPrimaryText: 'ไปต่อ',
        btnPrimaryBg: 'bg-emerald-500 hover:bg-emerald-600 shadow-[0_4px_0_#15803d]',
        btnHomeShow: false
      }
    };

    const theme = themes[config.type];

    ribbon.className = `absolute -top-6 left-1/2 -translate-x-1/2 w-[85%] py-2 rounded-2xl shadow-lg flex items-center justify-center border-2 ${theme.ribbonClass}`;
    card.className = `relative w-full max-w-xs md:max-w-sm bg-white rounded-[32px] pt-10 pb-6 px-5 text-center shadow-2xl border-4 ${theme.cardBorder} transition-all duration-200 scale-100`;
    ribbonText.textContent = theme.ribbonText;
    pandaImg.src = `${theme.pandaImg}?v=${Date.now()}`;
    title.textContent = theme.title;
    subtitle.textContent = theme.subtitle;

    if (theme.showStats) {
      statsBox.classList.remove('hidden');
      document.getElementById('modal-boss-count').textContent = `${state.bossesDefeated}/${TOTAL_BOSSES}`;
      document.getElementById('modal-score').textContent = `${state.score}`;
    } else {
      statsBox.classList.add('hidden');
    }

    btnPrimary.textContent = theme.btnPrimaryText;
    btnPrimary.className = `flex-1 py-2.5 px-4 rounded-2xl font-display font-bold text-white transition text-sm active:translate-y-0.5 ${theme.btnPrimaryBg}`;
    
    if (theme.btnHomeShow) {
      btnHome.classList.remove('hidden');
    } else {
      btnHome.classList.add('hidden');
    }

    btnHome.onclick = () => {
      window.location.href = 'index.html';
    };

    btnPrimary.onclick = () => {
      modal.classList.add('hidden');
      if (config.onPrimary) config.onPrimary();
    };

    modal.classList.remove('hidden');
  }

  function pauseGame() {
    state.paused = true;
    stopTimer();
    showGameModal({
      type: 'pause',
      onPrimary: () => {
        state.paused = false;
        startTimer(true);
      }
    });
  }

  function gameOver() {
    stopTimer();
    showGameModal({
      type: 'gameover',
      onPrimary: () => {
        loadBoss(state.bossIndex);
      }
    });
  }

  function bossDefeated() {
    stopTimer();
    state.bossesDefeated++;
    const next = state.bossIndex + 1;
    const isWin = next >= TOTAL_BOSSES;

    showGameModal({
      type: isWin ? 'win' : 'defeated',
      onPrimary: () => {
        if (isWin) {
          window.location.reload();
        } else {
          loadBoss(next);
        }
      }
    });
  }

  document.getElementById("stop-btn").addEventListener("click", pauseGame);

  document.querySelectorAll("[data-item]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const type = btn.getAttribute("data-item");
      if (state.items[type] <= 0 || state.answered) return;
      state.items[type]--;

      if (type === "heal") {
        state.playerHP = Math.min(state.playerHP + HEAL_AMOUNT, 100);
        updatePlayerHP(0);
      } else if (type === "fifty") {
        const q = state.currentQuestions[state.questionIndex];
        const correctChoice = q.aHanzi + " (" + q.aPinyin + ")";
        const wrong = [...document.querySelectorAll(".choice-btn")].filter((b) => b.dataset.choice !== correctChoice);
        shuffle(wrong).slice(0, 2).forEach((b) => {
          b.disabled = true;
          b.style.opacity = "0.3";
        });
      } else if (type === "skip") {
        state.answered = true;
        stopTimer();
        document.querySelectorAll(".choice-btn").forEach((b) => (b.disabled = true));
        setTimeout(checkOutcome, 500);
      }
      updateItemUI();
    });
  });

  document.getElementById("play-sound-btn").addEventListener("click", () => {
    speak(el.questionHanzi.textContent);
  });

  loadBoss(0);
</script>
</body>
