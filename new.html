<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game UI - Full Screen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');

        /* รีเซ็ตค่าเริ่มต้นและฟอนต์ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        /* ทำให้พื้นหลังเต็มหน้าเว็บ */
        body {
            background: linear-gradient(180deg, #9b51e0 0%, #6a1b9a 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* ซ่อนสิ่งที่ล้นจอ (ลูกกลม) */
            display: flex;
            justify-content: center;
        }

        /* --- เอฟเฟกต์ลูกกลมขยับไปมา (Background Bubbles) --- */
        .bubbles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px; height: 40px;
            background-color: rgba(255, 255, 255, 0.15);
            bottom: -150px;
            border-radius: 50%;
            animation: floatUp 25s infinite linear;
        }
        .bubbles li:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-duration: 15s; }
        .bubbles li:nth-child(2) { left: 20%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 17s; }
        .bubbles li:nth-child(3) { left: 25%; animation-delay: 4s; }
        .bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 22s; background-color: rgba(255, 255, 255, 0.25); }
        .bubbles li:nth-child(5) { left: 70%; animation-delay: 0s; }
        .bubbles li:nth-child(6) { left: 80%; width: 120px; height: 120px; animation-delay: 3s; background-color: rgba(255, 255, 255, 0.1); }
        .bubbles li:nth-child(7) { left: 32%; width: 160px; height: 160px; animation-delay: 7s; }
        .bubbles li:nth-child(8) { left: 55%; width: 20px; height: 20px; animation-delay: 15s; animation-duration: 40s; }
        .bubbles li:nth-child(9) { left: 25%; width: 10px; height: 10px; animation-delay: 2s; animation-duration: 40s; background-color: rgba(255, 255, 255, 0.3); }
        .bubbles li:nth-child(10) { left: 90%; width: 160px; height: 160px; animation-delay: 11s; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
            100% { transform: translateY(-1200px) rotate(720deg); opacity: 0; border-radius: 40%; }
        }

        /* --- กรอบเนื้อหาเกม --- */
        .game-content {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px; /* ควบคุมความกว้างไม่ให้ยืดเกินไปบนจอคอม */
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* --- UI Elements --- */
        .mode-title {
            color: white;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .badge {
            background: white;
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .pause-btn {
            background: white;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .boss-area {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }
        .boss-name { 
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .progress-bar-container {
            width: 100%;
            background: #5a1c7a;
            border-radius: 20px;
            height: 22px;
            position: relative;
            overflow: hidden;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .progress-bar-boss {
            background: #ff758c;
            width: 100%;
            height: 100%;
            transition: width 0.3s;
        }
        .hp-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
        
        /* เปลี่ยนจากกล่องเปล่าๆ เป็นแท็ก img และเชื่อม Path รูปตามที่ขอ */
        .boss-avatar {
            width: 140px; height: 140px;
            border-radius: 50%;
            margin: 15px auto;
            border: 3px solid #ff7eb3;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            object-fit: cover;
            background-color: #333;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            position: relative;
        }

        .time-display {
            background: black;
            color: white;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-family: monospace;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .question-text { font-size: 2rem; font-weight: 600; color: #222; }
        .pinyin-text { color: #888; font-size: 1rem; margin-top: 5px; }
        .sound-icon {
            position: absolute;
            top: 20px; right: 20px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .choice-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            color: #444;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .choice-btn:hover { 
            border-color: #9b51e0; 
            color: #9b51e0; 
            transform: translateY(-2px);
        }

        .player-area {
            margin-top: auto; /* ดันลงไปด้านล่างสุด */
            padding: 15px 20px;
            margin-bottom: 0;
        }
        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }
        .player-items span { margin-left: 8px; cursor: pointer; font-size: 1.2rem; }
        
        .progress-bar-player {
            background: #ff4b2b;
            width: 100%;
            height: 100%;
            transition: width 0.3s;
        }

        /* --- เอฟเฟกต์โดนดาเมจ (Damage Effect) --- */
        .damage-effect {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            box-shadow: 0 0 20px 5px rgba(255, 0, 0, 0.6) !important;
            border: 2px solid red;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

    </style>
</head>
<body>

    <!-- พื้นหลังลูกกลม (เต็มจอ) -->
    <ul class="bubbles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- ส่วนเนื้อหาเกม -->
    <div class="game-content">
        
        <div class="mode-title">Ez mode</div>

        <div class="top-bar">
            <div class="badge">⚔️ Boss 1/5</div>
            <div class="badge">⭐ 0 <span style="color:#888; font-weight:normal;">x1</span></div>
            <button class="pause-btn">⏸</button>
        </div>

        <div class="boss-area">
            <div class="boss-name">จอมเวลา ปิศาจนาฬิกา</div>
            <div class="progress-bar-container">
                <div class="progress-bar-boss" style="width: 100%;"></div>
                <div class="hp-text">100/100</div>
            </div>
            <!-- เชื่อม Path รูปภาพ ตามที่คอมเมนต์ขอไว้ -->
            <img src="image_b276f6.jpg" alt="Boss Character" class="boss-avatar"> 
        </div>

        <div class="card question-card">
            <div class="sound-icon">🔊</div>
            <div class="time-display">08:00</div>
            <div class="question-text">两点</div>
            <div class="pinyin-text">Liǎng diǎn</div>
        </div>

        <div class="choices-grid">
            <button class="choice-btn" onclick="takeDamage()">คำถาม (ผิด)</button>
            <button class="choice-btn">คำถาม</button>
            <button class="choice-btn">คำถาม</button>
            <button class="choice-btn">คำถาม</button>
        </div>

        <!-- กรอบผู้เล่น -->
        <div class="card player-area" id="playerCard">
            <div class="player-info">
                <div>🐼 Panda ภาษาจีน</div>
                <div class="player-items">
                    <span>🧪</span><span>🛡️</span><span>✨</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="color: #ff4b2b; font-size: 1.4rem;">❤️</span>
                <div class="progress-bar-container" style="flex-grow: 1; height: 18px;">
                    <div class="progress-bar-player" id="playerHpBar" style="width: 100%;"></div>
                    <div class="hp-text" id="playerHpText" style="font-size: 0.65rem;">100/100</div>
                </div>
            </div>
        </div>

    </div>

<script>
    // ฟังก์ชันจำลองการโดนดาเมจ (กดที่ปุ่ม 'คำถาม (ผิด)' เพื่อทดสอบ)
    let currentHp = 100;

    function takeDamage() {
        const playerCard = document.getElementById('playerCard');
        const hpBar = document.getElementById('playerHpBar');
        const hpText = document.getElementById('playerHpText');

        // ลดเลือด
        currentHp -= 10;
        if(currentHp < 0) currentHp = 0;
        
        hpBar.style.width = currentHp + '%';
        hpText.innerText = currentHp + '/100';

        // แสดงเอฟเฟกต์
        playerCard.classList.add('damage-effect');

        // ลบเอฟเฟกต์ออกเมื่อแสดงผลเสร็จ (เพื่อให้กดซ้ำได้)
        setTimeout(() => {
            playerCard.classList.remove('damage-effect');
        }, 400);
    }
</script>

</body>
</html>
